[project]
name = "vidtoolz-t2s"
version = "0.1.0"
description = "Text to speech using kokoro for mac os"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
    "kokoro_onnx",
    "soundfile"
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-t2s"
Changelog = "https://github.com/sukhbinder/vidtoolz-t2s/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-t2s/issues"
CI = "https://github.com/sukhbinder/vidtoolz-t2s/actions"

[project.entry-points."vidtoolz_plugins"]
t2s = "vidtoolz_t2s:t2s_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
